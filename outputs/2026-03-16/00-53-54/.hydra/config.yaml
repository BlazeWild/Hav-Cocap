_target_: __main__.train
model:
  _target_: havcocap_new.modeling.lm_cocap.CoCapLM
  cocap_model:
    _target_: havcocap_new.modules.compressed_video.compressed_video_captioner.CompressedVideoCaptioner
    compressed_video_transformer:
      _target_: havcocap_new.modules.compressed_video.compressed_video_transformer.CompressedVideoTransformer.from_pretrained
      pretrained_clip_name_or_path: ViT-B/16
      motion_patch_size: 8
      motion_layers: 2
      motion_heads: 8
      residual_patch_size: 64
      residual_layers: 2
      residual_heads: 8
      action_layers: 1
      action_heads: 8
      n_bp: 59
    caption_head:
      _target_: havcocap_new.modules.compressed_video.compressed_video_captioner.CaptionHead.from_pretrained
      pretrained_clip_name_or_path: ViT-B/16
      max_v_len: 16
      max_t_len: 77
      verbose: false
    motion_dropout_prob: 0.2
    residual_dropout_prob: 0.2
    use_audio: false
    audio_encoder: null
  loss:
    _target_: havcocap_new.modeling.loss.LabelSmoothingLoss
    label_smoothing: 0.1
    target_vocab_size: 49408
    ignore_index: 0
  lr: 0.0001
  clip_lr: 1.0e-06
  warmup_ratio: 0.05
  lr_decay_gamma: 0.95
