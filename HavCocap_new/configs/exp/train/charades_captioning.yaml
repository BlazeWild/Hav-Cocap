# @package _global_

defaults:
  - /train # define in code
  - /dataset@train_dataloader.dataset: charades
  - /dataset@val_dataloader.dataset: charades
  - /exp/train/base
  - _self_

trainer:
  default_root_dir: "./logs/charades_captioning"

# Override val_dataloader to explicitly use the "val" split we created
val_dataloader:
  dataset:
    split: "val"

# Override model parameters for audio integration
model:
  cocap_model:
    use_audio: True
    caption_head:
      max_v_len: 48  # 16 GOPs * 3 blocks (Context + Action + Audio) = 48
