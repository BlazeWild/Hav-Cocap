_target_: __main__.train
model:
  _target_: havcocap_new.modeling.lm_cocap.CoCapLM
  cocap_model:
    _target_: havcocap_new.modules.compressed_video.compressed_video_captioner.CompressedVideoCaptioner
    compressed_video_transformer:
      _target_: havcocap_new.modules.compressed_video.compressed_video_transformer.CompressedVideoTransformer.from_pretrained
      pretrained_clip_name_or_path: ViT-B/16
      motion_patch_size: 8
      motion_layers: 2
      motion_heads: 8
      residual_patch_size: 64
      residual_layers: 2
      residual_heads: 8
      action_layers: 1
      action_heads: 8
      n_bp: 59
    caption_head:
      _target_: havcocap_new.modules.compressed_video.compressed_video_captioner.CaptionHead.from_pretrained
      pretrained_clip_name_or_path: ViT-B/16
      max_v_len: 48
      max_t_len: 77
      verbose: false
    motion_dropout_prob: 0.2
    residual_dropout_prob: 0.2
    use_audio: true
    audio_encoder: null
  loss:
    _target_: havcocap_new.modeling.loss.LabelSmoothingLoss
    label_smoothing: 0.1
    target_vocab_size: 49408
    ignore_index: 0
  lr: 0.0001
  clip_lr: 1.0e-06
  warmup_ratio: 0.05
  lr_decay_gamma: 0.95
train_dataloader:
  _target_: torch.utils.data.dataloader.DataLoader
  dataset:
    _target_: havcocap_new.data.datasets.compressed_video.dataset_charades.CharadesCaptioningDataset
    video_root: ../../____RESEARCH/Hav-Cocap/HavCocap_new/dataset/Charades/Charades_filtered_240
    metadata: ../../____RESEARCH/Hav-Cocap/HavCocap_new/dataset/Charades/charades_filter_captioning.json
    video_reader: read_frames_compressed_domain
    max_frames: 16
    video_size:
    - 224
    - 224
    max_words: 77
    unfold_sentences: true
    cv_config:
      num_gop: 16
      num_mv: 59
      num_res: 59
      with_residual: true
      use_pre_extract: false
      sample: rand
    split: train
  batch_size: 1
  shuffle: true
  sampler: null
  batch_sampler: null
  num_workers: 4
  collate_fn: null
  pin_memory: true
  drop_last: false
  timeout: 0.0
  worker_init_fn: null
  multiprocessing_context: fork
  generator: null
  prefetch_factor: null
  persistent_workers: false
  pin_memory_device: ''
val_dataloader:
  _target_: torch.utils.data.dataloader.DataLoader
  dataset:
    _target_: havcocap_new.data.datasets.compressed_video.dataset_charades.CharadesCaptioningDataset
    video_root: ../../____RESEARCH/Hav-Cocap/HavCocap_new/dataset/Charades/Charades_filtered_240
    metadata: ../../____RESEARCH/Hav-Cocap/HavCocap_new/dataset/Charades/charades_filter_captioning.json
    video_reader: read_frames_compressed_domain
    max_frames: 16
    video_size:
    - 224
    - 224
    max_words: 77
    unfold_sentences: true
    cv_config:
      num_gop: 16
      num_mv: 59
      num_res: 59
      with_residual: true
      use_pre_extract: false
      sample: rand
    split: val
  batch_size: 1
  shuffle: false
  sampler: null
  batch_sampler: null
  num_workers: 3
  collate_fn: null
  pin_memory: true
  drop_last: false
  timeout: 0.0
  worker_init_fn: null
  multiprocessing_context: fork
  generator: null
  prefetch_factor: null
  persistent_workers: false
  pin_memory_device: ''
trainer:
  _target_: pytorch_lightning.trainer.trainer.Trainer
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 1
  precision: null
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${trainer.default_root_dir}
  callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    save_top_k: -1
  fast_dev_run: false
  max_epochs: 20
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
